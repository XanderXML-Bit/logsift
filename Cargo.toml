[package]
name = "logsift"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Triage bunyan-format JSON logs: summarize, filter, and flag error bursts from the command line"
license = "MIT"
repository = "https://github.com/XanderXML-Bit/logsift"
readme = "README.md"
keywords = ["logs", "bunyan", "triage", "cli", "ops"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
flate2 = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
